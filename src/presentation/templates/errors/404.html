{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <h1 class="display-4">404</h1>
      <p class="lead mb-4">La página que estás buscando no existe o fue movida.</p>
      <p class="mb-4">Si llegaste aquí siguiendo un enlace interno, puede que el recurso ya no esté disponible.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        Volver al inicio
      </a>
    </div>
  </div>
</div>
{% endblock %}
